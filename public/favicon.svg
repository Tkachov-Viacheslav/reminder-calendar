<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="brand-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="header-grad" x1="14" y1="14" x2="50" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="32" y1="36" x2="46" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="cal-shadow" x="8" y="10" width="48" height="48" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1E1B4B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#brand-grad)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Calendar Container with shadow -->
  <g filter="url(#cal-shadow)">
    <!-- White paper card -->
    <rect x="13" y="15" width="38" height="36" rx="8" fill="#FFFFFF"/>

    <!-- Calendar Header Stripe -->
    <path d="M13 22C13 18.134 16.134 15 20 15H44C47.866 15 51 18.134 51 22V26H13V22Z" fill="url(#header-grad)"/>
    <line x1="13" y1="26" x2="51" y2="26" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Binder Rings -->
    <rect x="21" y="11" width="4" height="8" rx="2" fill="#E0E7FF" stroke="#4F46E5" stroke-width="1.2"/>
    <rect x="39" y="11" width="4" height="8" rx="2" fill="#E0E7FF" stroke="#4F46E5" stroke-width="1.2"/>

    <!-- Calendar Grid Dots -->
    <circle cx="21" cy="33" r="2" fill="#94A3B8"/>
    <circle cx="29" cy="33" r="2" fill="#94A3B8"/>
    <circle cx="37" cy="33" r="2" fill="#94A3B8"/>
    <circle cx="45" cy="33" r="2" fill="#94A3B8"/>

    <circle cx="21" cy="41" r="2" fill="#94A3B8"/>
    <circle cx="29" cy="41" r="2" fill="#94A3B8"/>
    
    <!-- Active Highlighted Event Capsule -->
    <rect x="34" y="38" width="13" height="6" rx="3" fill="url(#accent-grad)"/>
  </g>

  <!-- Notification Badge / Reminder Bell indicator -->
  <circle cx="48" cy="14" r="5" fill="#EF4444" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="48" cy="14" r="1.8" fill="#FFFFFF"/>
</svg>